<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Veera Store</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
    }

    header{
      background:#111827;
      color:white;
      padding:20px;
      text-align:center;
    }

    nav{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:10px;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-size:14px;
    }

    .hero{
      background:linear-gradient(to right,#2563eb,#7c3aed);
      color:white;
      text-align:center;
      padding:60px 20px;
    }

    .hero h1{
      font-size:42px;
      margin-bottom:10px;
    }

    .hero p{
      font-size:18px;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      padding:40px;
    }

    .card{
      background:white;
      border-radius:10px;
      padding:20px;
      text-align:center;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .card img{
      width:100%;
      height:180px;
      object-fit:cover;
      border-radius:8px;
    }

    .card h3{
      margin:15px 0 10px;
    }

    .price{
      color:green;
      font-weight:bold;
      margin-bottom:10px;
    }

    button{
      background:#2563eb;
      color:white;
      border:none;
      padding:10px 20px;
      border-radius:5px;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    footer{
      background:#111827;
      color:white;
      text-align:center;
      padding:15px;
      margin-top:20px;
    }
  </style>
</head>

<body>

  <header>
    <h2>🛒 Veera Store</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Offers</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to Veera Store</h1>
    <p>Simple Ecommerce Website Hosted on AWS S3</p>
  </section>

  <section class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Shoes">
      <h3>Running Shoes</h3>
      <p class="price">₹1999</p>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="Watch">
      <h3>Smart Watch</h3>
      <p class="price">₹2999</p>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Phone">
      <h3>Mobile Phone</h3>
      <p class="price">₹14999</p>
      <button>Buy Now</button>
    </div>

  </section>

  <footer>
    <p>© 2026 Veerabuthran Store | Hosted by veera</p>
  </footer>

</body>
</html>
